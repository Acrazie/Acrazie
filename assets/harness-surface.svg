<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 145" width="100%" height="auto">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .font-mono { font-family: "SF Mono", Monaco, "Cascadia Code", "Fira Code", monospace; }
    </style>
  </defs>
  <!-- Card Claude Code -->
  <g transform="translate(10.5, 10)">
    <rect width="260" height="125" rx="10" fill="#090D16" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1.2" />
    <!-- Header bar -->
    <rect x="14" y="14" width="6" height="6" rx="3" fill="#818CF8" />
    <text class="font-mono" x="26" y="20" fill="#818CF8" font-size="9.5px" font-weight="600" letter-spacing="0.08em">AGENTIC CLI</text>
    <text class="font-sans" x="14" y="44" fill="#FFFFFF" font-size="16px" font-weight="700">Claude Code</text>
    <text class="font-sans" x="14" y="62" fill="#94A3B8" font-size="12px" font-weight="500">Terminal coding agent</text>
    <line x1="14" y1="74" x2="246" y2="74" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <text class="font-sans" x="14" y="93" fill="#64748B" font-size="11px" font-weight="400">
      <tspan x="14" dy="0">Autonomous feature work, iterative refactors,</tspan>
      <tspan x="14" dy="14">and test validation in local repos.</tspan>
    </text>
  </g>
  <!-- Card Codex -->
  <g transform="translate(283.5, 10)">
    <rect width="260" height="125" rx="10" fill="#090D16" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1.2" />
    <!-- Header bar -->
    <rect x="14" y="14" width="6" height="6" rx="3" fill="#818CF8" />
    <text class="font-mono" x="26" y="20" fill="#818CF8" font-size="9.5px" font-weight="600" letter-spacing="0.08em">BACKGROUND DEV</text>
    <text class="font-sans" x="14" y="44" fill="#FFFFFF" font-size="16px" font-weight="700">Codex</text>
    <text class="font-sans" x="14" y="62" fill="#94A3B8" font-size="12px" font-weight="500">Cloud engineering harness</text>
    <line x1="14" y1="74" x2="246" y2="74" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <text class="font-sans" x="14" y="93" fill="#64748B" font-size="11px" font-weight="400">
      <tspan x="14" dy="0">Parallel worktrees, background CI/CD operations,</tspan>
      <tspan x="14" dy="14">and repo-scale code intelligence.</tspan>
    </text>
  </g>
  <!-- Card Hermes -->
  <g transform="translate(556.5, 10)">
    <rect width="260" height="125" rx="10" fill="#090D16" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1.2" />
    <!-- Header bar -->
    <rect x="14" y="14" width="6" height="6" rx="3" fill="#818CF8" />
    <text class="font-mono" x="26" y="20" fill="#818CF8" font-size="9.5px" font-weight="600" letter-spacing="0.08em">TOOL RUNTIME</text>
    <text class="font-sans" x="14" y="44" fill="#FFFFFF" font-size="16px" font-weight="700">Hermes</text>
    <text class="font-sans" x="14" y="62" fill="#94A3B8" font-size="12px" font-weight="500">Autonomous agent engine</text>
    <line x1="14" y1="74" x2="246" y2="74" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <text class="font-sans" x="14" y="93" fill="#64748B" font-size="11px" font-weight="400">
      <tspan x="14" dy="0">Local tool execution, custom skill</tspan>
      <tspan x="14" dy="14">invocation, continuous subagent delegation.</tspan>
    </text>
  </g>
  <!-- Card Anti-Gravity -->
  <g transform="translate(829.5, 10)">
    <rect width="260" height="125" rx="10" fill="#090D16" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1.2" />
    <!-- Header bar -->
    <rect x="14" y="14" width="6" height="6" rx="3" fill="#818CF8" />
    <text class="font-mono" x="26" y="20" fill="#818CF8" font-size="9.5px" font-weight="600" letter-spacing="0.08em">ORCHESTRATION</text>
    <text class="font-sans" x="14" y="44" fill="#FFFFFF" font-size="16px" font-weight="700">Anti-Gravity</text>
    <text class="font-sans" x="14" y="62" fill="#94A3B8" font-size="12px" font-weight="500">Multi-agent systems</text>
    <line x1="14" y1="74" x2="246" y2="74" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <text class="font-sans" x="14" y="93" fill="#64748B" font-size="11px" font-weight="400">
      <tspan x="14" dy="0">Coordinated multi-agent planning, rigorous decision</tspan>
      <tspan x="14" dy="14">trees, and verifiable outputs.</tspan>
    </text>
  </g>
</svg>