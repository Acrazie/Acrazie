<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 880 270" fill="none" role="img" aria-labelledby="term-title">
  <title id="term-title">Acrazie Agentic Session</title>
  <defs>
    <linearGradient id="term-border" x1="0" y1="0" x2="880" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7295F5" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#A8BFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#626CE8" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="term-glow" cx="800" cy="50" r="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#626CE8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0E121B" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: blink 1.1s infinite;
      }
      .term-code {
        font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "Fira Code", Menlo, Monaco, Consolas, monospace;
        font-size: 13.5px;
        letter-spacing: 0.2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .cursor { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="1" y="1" width="878" height="268" rx="12" fill="#0D111A" stroke="url(#term-border)" stroke-width="1.5"/>
  <rect x="1" y="1" width="878" height="268" rx="12" fill="url(#term-glow)"/>

  <!-- Window Header -->
  <rect x="1" y="1" width="878" height="40" rx="12" fill="#131825"/>
  <rect x="1" y="30" width="878" height="11" fill="#131825"/>
  <line x1="1" y1="41" x2="879" y2="41" stroke="#222B3E" stroke-width="1"/>

  <!-- Controls -->
  <circle cx="26" cy="21" r="5.5" fill="#FF5F56"/>
  <circle cx="44" cy="21" r="5.5" fill="#FFBD2E"/>
  <circle cx="62" cy="21" r="5.5" fill="#27C93F"/>

  <text x="440" y="25" text-anchor="middle" fill="#7C8BA1" class="term-code" font-size="12">acrazie@agent-workstation: ~/skills (zsh)</text>

  <!-- Terminal Body -->
  <g class="term-code">
    <!-- Prompt 1 -->
    <text x="32" y="76">
      <tspan fill="#7295F5">✦ </tspan>
      <tspan fill="#A8BFFF" font-weight="600">acrazie@agentic</tspan>
      <tspan fill="#626CE8">:</tspan>
      <tspan fill="#C5B9F5">~/skills</tspan>
      <tspan fill="#8E9EB5">$ </tspan>
      <tspan fill="#F8F9FF">antigravity dispatch --profile --live</tspan>
    </text>

    <!-- Output 1: Skills -->
    <text x="32" y="108">
      <tspan fill="#34D399">✔ </tspan>
      <tspan fill="#F8F9FF">11 agent skills loaded </tspan>
      <tspan fill="#7A8CA3">(audit-repository · svg-icon-designer · skill-refiner · jenkins ...)</tspan>
    </text>

    <!-- Output 2: Harnesses -->
    <text x="32" y="140">
      <tspan fill="#7295F5">✦ </tspan>
      <tspan fill="#F8F9FF">Harnesses connected: </tspan>
      <tspan fill="#A8BFFF">Claude Code</tspan>
      <tspan fill="#58687D"> · </tspan>
      <tspan fill="#A8BFFF">Codex</tspan>
      <tspan fill="#58687D"> · </tspan>
      <tspan fill="#A8BFFF">Hermes</tspan>
      <tspan fill="#58687D"> · </tspan>
      <tspan fill="#A8BFFF">Anti-Gravity</tspan>
    </text>

    <!-- Output 3: Status -->
    <text x="32" y="172">
      <tspan fill="#818CF8">● </tspan>
      <tspan fill="#94A3B8">Ecosystem status: </tspan>
      <tspan fill="#38BDF8">Ready for autonomous pair-programming.</tspan>
    </text>

    <!-- Prompt 2 with flowing cursor -->
    <text x="32" y="214">
      <tspan fill="#7295F5">✦ </tspan>
      <tspan fill="#A8BFFF" font-weight="600">acrazie@agentic</tspan>
      <tspan fill="#626CE8">:</tspan>
      <tspan fill="#C5B9F5">~/skills</tspan>
      <tspan fill="#8E9EB5">$ </tspan>
      <tspan fill="#94A3B8" font-style="italic">listening for agent events... </tspan>
      <tspan fill="#7295F5" class="cursor">▋</tspan>
    </text>
  </g>
</svg>
